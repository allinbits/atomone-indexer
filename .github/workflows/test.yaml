name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Starts with `tsc --noEmit`, so this is the type check as well.
      - name: Build
        run: pnpm build
