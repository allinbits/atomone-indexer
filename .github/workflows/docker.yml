name: Build and Push Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # The Release workflow calls this on every push to main: directly on a push
  # trigger as well would build the same commit twice, and a tag pushed with
  # GITHUB_TOKEN starts no workflow of its own, so the release passes the
  # version it just tagged.
  workflow_call:
    inputs:
      version:
        description: Version to tag the image with, alongside latest
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
